<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>採点侍</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <h1>採点侍 <span id="version" class="version"></span></h1>
  <span id="bridge-status" class="bridge-status" data-state="connecting">接続中…</span>
</header>

<main id="app">
  <section id="mode-select" class="mode-select">
    <h2>採点モードを選択してください</h2>
    <div class="mode-cards">
      <button class="mode-card" data-mode="mark_only" data-format="standard">
        <span class="mode-title">マーク採点のみ</span>
        <span class="mode-desc">座標ファイルを使ったOMR認識・マーク採点を実行します</span>
      </button>
      <button class="mode-card" data-mode="mark_and_descriptive" data-format="standard">
        <span class="mode-title">マーク採点 ＋ 記述採点</span>
        <span class="mode-desc">マーク採点に加えて、記述式問題の採点も行います</span>
      </button>
      <button class="mode-card" data-mode="descriptive_only" data-format="standard">
        <span class="mode-title">記述採点のみ</span>
        <span class="mode-desc">座標ファイル不要。答案画像から記述問題のみを採点します</span>
      </button>
      <button class="mode-card math" data-mode="mark_only" data-format="multi_digit">
        <span class="mode-title">数学マーク採点のみ</span>
        <span class="mode-desc">共通テスト数学式。複数のマーク行で1つの値（-24等）を完答採点します</span>
      </button>
      <button class="mode-card math" data-mode="mark_and_descriptive" data-format="multi_digit">
        <span class="mode-title">数学マーク採点 ＋ 記述採点</span>
        <span class="mode-desc">数学マーク採点に加えて、記述式問題の採点も行います</span>
      </button>
    </div>
    <button class="btn" id="btn-resume-session" hidden>前回の採点を再開する</button>
  </section>

  <section class="panel" id="datasource-panel">
    <h2>データソース</h2>

    <div class="ds-row" id="row-image-folder">
      <span class="ds-label">画像フォルダ</span>
      <span class="ds-value" data-empty="未選択"></span>
      <button class="btn" data-action="select_image_folder">フォルダ選択</button>
      <button class="btn" id="btn-select-pdf" title="PDFを画像に展開して読み込む">PDF選択</button>
    </div>
    <p class="ds-summary" id="summary-image-folder" hidden></p>

    <div class="ds-row" id="row-coord-file">
      <span class="ds-label">座標ファイル</span>
      <span class="ds-value" data-empty="未選択"></span>
      <button class="btn" data-action="select_coord_file">ファイル選択</button>
    </div>
    <p class="ds-summary" id="summary-coord-file" hidden></p>

    <div class="ds-row" id="row-answer-key">
      <span class="ds-label">正答データ</span>
      <span class="ds-value" data-empty="未選択"></span>
      <button class="btn" data-action="select_answer_key">ファイル選択</button>
    </div>
    <p class="ds-summary" id="summary-answer-key" hidden></p>

    <div class="ds-row ds-options">
      <label for="skip-input">Skip（ID欄の数）</label>
      <input id="skip-input" type="number" min="0" value="4"> 欄
    </div>
  </section>

  <section class="panel" id="step1-panel">
    <h2>Step 1: 認識</h2>

    <div class="ds-row">
      <label for="omr-mode">認識方式</label>
      <select id="omr-mode">
        <option value="kmeans">（推奨）クラスタリング</option>
        <option value="threshold">しきい値による識別（従来式）</option>
      </select>
      <span id="threshold-inputs" hidden>
        濃さ <input id="color-th" type="number" step="0.05" min="0.05" max="0.95">
        面積 <input id="area-th" type="number" step="0.05" min="0.05" max="0.95">
        <button class="btn" id="btn-calibrate"
                title="サンプル画像からしきい値を推定して適用">自動調整</button>
      </span>
    </div>

    <div class="ds-row">
      <button class="btn btn-primary" id="btn-run-recognition">▶ 認識実行</button>
      <button class="btn" id="btn-cancel" hidden>⏹ 中断</button>
      <progress id="job-progress" max="1" value="0" hidden></progress>
      <span id="job-status" class="job-status"></span>
    </div>

    <div class="ds-row">
      <button class="btn" id="btn-open-checker">マークチェック</button>
    </div>

    <div class="ds-row" id="row-omr-result">
      <span class="ds-label">OMR結果</span>
      <span class="ds-value" data-empty="未生成（認識実行で自動設定）"></span>
      <button class="btn" data-action="select_omr_result">ファイル選択</button>
    </div>
  </section>

  <section class="panel" id="step2-panel">
    <h2>Step 2: 採点</h2>
    <div class="ds-row desc-only-ui" hidden>
      <button class="btn" id="btn-desc-config">記述問題設定</button>
      <button class="btn" id="btn-desc-scoring">記述採点</button>
      <span class="hint" id="desc-progress-hint"></span>
    </div>
    <div class="ds-row">
      <button class="btn btn-primary" id="btn-run-scoring">▶ 採点済み答案を生成</button>
      <span class="hint">○×・得点を描き込んだ答案画像を出力します</span>
    </div>
    <div class="ds-row">
      <button class="btn" id="btn-total-position">合計点の位置指定</button>
      <span class="hint" id="total-position-hint">未設定（自動配置）</span>
    </div>
  </section>

  <section class="panel" id="step3-panel">
    <h2>Step 3: 集計</h2>
    <div class="ds-row">
      <label><input type="checkbox" id="name-trim-check" checked>
        氏名画像を集計シートに表示する</label>
      <button class="btn" id="btn-name-position">氏名欄の位置指定</button>
      <span class="hint" id="name-position-hint">未指定（指定すると集計に氏名画像が入ります）</span>
    </div>
    <div class="ds-row">
      <button class="btn btn-primary" id="btn-run-summary">▶ 集計実行</button>
      <span class="hint">成績一覧 Excel と CTT 分析レポートを出力します</span>
    </div>
  </section>

  <section class="panel">
    <h2>処理ログ</h2>
    <div id="log" class="log" aria-live="polite"></div>
  </section>

  <!-- 記述問題設定ビュー -->
  <section id="desc-config-view" hidden>
    <div class="checker-head">
      <h2>記述問題設定</h2>
      <span class="checker-summary" id="desc-config-summary"></span>
      <button class="btn" id="btn-desc-config-close">閉じる</button>
    </div>
    <table class="desc-table" id="desc-table">
      <thead><tr><th>ID</th><th>名前</th><th>配点</th><th>観点</th><th>領域</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="ds-row desc-add-row">
      <input id="new-q-name" placeholder="問題名（例: 問3）">
      配点 <input id="new-q-max" type="number" min="1" value="5">
      観点 <input id="new-q-aspect" type="number" min="1" value="1">
      <button class="btn btn-primary" id="btn-add-question">＋ 領域を指定して追加</button>
    </div>
  </section>

  <!-- 記述採点ビュー（問題別グリッド） -->
  <section id="desc-scoring-view" hidden>
    <div class="checker-head">
      <h2>記述採点</h2>
      <span class="checker-summary" id="desc-scoring-summary"></span>
      <button class="btn" id="btn-single-sheet">一枚ずつ採点する</button>
      <button class="btn" id="btn-desc-scoring-close">閉じる</button>
    </div>
    <nav id="desc-q-tabs" class="checker-tabs"></nav>
    <div id="desc-grid" class="checker-grid"></div>
  </section>

  <!-- 一枚採点ビュー（画像レイヤ＋注釈レイヤ。コメントモードの差し込み口） -->
  <section id="single-sheet-view" hidden>
    <div class="checker-head">
      <h2>一枚採点</h2>
      <span class="checker-summary" id="single-sheet-name"></span>
      <button class="btn" id="btn-sheet-prev">◀ 前の答案</button>
      <button class="btn" id="btn-sheet-next">次の答案 ▶</button>
      <button class="btn" id="btn-single-close">問題別に戻る</button>
    </div>
    <div class="single-layout">
      <div class="sheet-stage" id="sheet-stage">
        <img id="sheet-image" alt="答案">
        <div class="annotation-layer" id="annotation-layer"></div>
      </div>
      <aside class="sheet-side" id="sheet-side"></aside>
    </div>
  </section>

  <!-- マークチェックビュー（開いている間は他パネルを隠す） -->
  <section id="checker-view" hidden>
    <div class="checker-head">
      <h2>マークチェック</h2>
      <span id="checker-summary" class="checker-summary"></span>
      <button class="btn btn-primary" id="btn-apply-corrections">💾 xlsxに反映</button>
      <button class="btn" id="btn-close-checker">閉じる</button>
    </div>
    <nav id="checker-tabs" class="checker-tabs"></nav>
    <div id="checker-grid" class="checker-grid"></div>
    <div class="checker-pager">
      <button class="btn" id="pager-prev">◀ 前へ</button>
      <span id="pager-info"></span>
      <button class="btn" id="pager-next">次へ ▶</button>
    </div>
  </section>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
