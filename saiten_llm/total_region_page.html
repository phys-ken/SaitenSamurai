<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合計点の位置</title>
<style>
  :root {
    --paper: #ffffff; --ink: #1f2328; --muted: #5b636b; --rule: #d5dbe0;
    --accent: #b8322a; --ok: #2f6f4f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
         color: var(--ink); background: #f3f4f5; }
  header { background: var(--paper); border-bottom: 1px solid var(--rule);
           padding: 12px 20px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .step { color: var(--muted); font-size: 14px; }
  main { padding: 16px 20px 96px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .stage { position: relative; background: var(--paper); border: 1px solid var(--rule);
           display: inline-block; max-width: 100%; }
  .stage img { display: block; max-width: 100%; max-height: calc(100vh - 160px); user-select: none; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  aside { background: var(--paper); border: 1px solid var(--rule); padding: 14px; font-size: 14px;
          position: sticky; top: 12px; }
  aside h2 { font-size: 15px; margin: 0 0 8px; }
  aside p { margin: 0 0 10px; line-height: 1.6; color: var(--muted); }
  aside label { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 12px; line-height: 1.5; }
  button { font: inherit; padding: 8px 14px; border-radius: 4px; border: 1px solid var(--rule);
           background: var(--paper); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 3px solid #2b6cb0; outline-offset: 2px; }
  #preview-img { display: block; max-width: 100%; border: 1px solid var(--rule); background: var(--paper); }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper);
           border-top: 1px solid var(--rule); padding: 12px 20px; display: flex; gap: 16px;
           align-items: center; flex-wrap: wrap; }
  footer label { display: flex; gap: 8px; align-items: center; }
  .note { color: var(--accent); }
  .done { max-width: 560px; margin: 60px auto; background: var(--paper); border: 1px solid var(--rule);
          padding: 28px; line-height: 1.8; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>合計点を書く位置を決める</h1>
  <span class="step" id="step-label"></span>
</header>

<main>
  <section id="editor">
    <div class="layout">
      <div>
        <div class="stage">
          <img id="page-img" alt="答案（黒塗り済み）">
          <canvas id="draw"></canvas>
        </div>
      </div>
      <aside>
        <h2>「得点」欄を囲む</h2>
        <p id="help">答案の上をドラッグして、合計点を書いてほしい欄（「得点」欄など）を囲んでください。
           囲み直すと、前の枠と入れ替わります。</p>
        <label><input type="checkbox" id="lower-half" checked>
          囲んだ枠の下半分に書く（枠の上の方に「得点」などの見出しがあるとき）</label>
        <button class="primary" id="try" disabled>この位置で試し描きする</button>
        <p id="detected-note" hidden>自動で見つけた欄を緑の枠で示しています。合っていれば、そのまま試し描きしてください。</p>
      </aside>
    </div>
  </section>

  <section id="preview" hidden>
    <p>この答案の点数で、合計点を描いてみた様子です（緑の線は書く範囲の目安で、実物には出ません）。
       文字が欄からはみ出していないか、見出しに重なっていないか確かめてください。</p>
    <img id="preview-img" alt="試し描き">
  </section>

  <section id="done" hidden>
    <div class="done">
      <h2>承認しました</h2>
      <p>合計点を書く位置を記録しました。このページは閉じてかまいません。<br>
         チャットに戻って、LLM に「合計点の位置を承認した」と伝えてください。</p>
    </div>
  </section>
</main>

<footer id="approve-bar" hidden>
  <label><input type="checkbox" id="confirm"> 試し描きを見て、合計点が欄に収まっていることを確かめました</label>
  <button class="primary" id="approve" disabled>承認して終える</button>
  <button id="redo">囲み直す</button>
</footer>

<script>
const TOKEN = "__TOKEN__";
const q = (s) => document.querySelector(s);
let rect = null;          // 囲んだ枠（画像に対する 0〜1）
let detected = false;     // rect が自動で見つけたものか

async function api(path, body) {
  const opts = body ? { method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body) } : {};
  const res = await fetch(`${path}${path.includes("?") ? "&" : "?"}t=${TOKEN}`, opts);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "エラーが起きました");
  return data;
}

function draw(dragging) {
  const img = q("#page-img"), cv = q("#draw");
  cv.width = img.clientWidth; cv.height = img.clientHeight;
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  const r = dragging || rect;
  if (!r) return;
  ctx.lineWidth = 3;
  ctx.strokeStyle = detected && !dragging ? "#2f6f4f" : "#b8322a";
  ctx.strokeRect(r[0] * cv.width, r[1] * cv.height, (r[2] - r[0]) * cv.width, (r[3] - r[1]) * cv.height);
  if (q("#lower-half").checked) {
    const mid = (r[1] + r[3]) / 2;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(r[0] * cv.width, mid * cv.height, (r[2] - r[0]) * cv.width, (r[3] - mid) * cv.height);
    ctx.setLineDash([]);
  }
}

let dragStart = null;
function pos(e) {
  const b = q("#draw").getBoundingClientRect();
  return [Math.min(1, Math.max(0, (e.clientX - b.left) / b.width)),
          Math.min(1, Math.max(0, (e.clientY - b.top) / b.height))];
}
function box(a, p) {
  return [Math.min(a[0], p[0]), Math.min(a[1], p[1]), Math.max(a[0], p[0]), Math.max(a[1], p[1])];
}
q("#draw").addEventListener("pointerdown", (e) => { dragStart = pos(e); q("#draw").setPointerCapture(e.pointerId); });
q("#draw").addEventListener("pointermove", (e) => { if (dragStart) draw(box(dragStart, pos(e))); });
q("#draw").addEventListener("pointerup", (e) => {
  if (!dragStart) return;
  const r = box(dragStart, pos(e));
  dragStart = null;
  if (r[2] - r[0] > 0.005 && r[3] - r[1] > 0.005) { rect = r; detected = false; q("#detected-note").hidden = true; }
  q("#try").disabled = !rect;
  draw();
});
q("#lower-half").onchange = () => draw();
window.addEventListener("resize", () => draw());

function body() { return { rect, lower_half: q("#lower-half").checked }; }

q("#try").onclick = async () => {
  try {
    const res = await api("/api/preview", body());
    q("#preview-img").src = res.image;
    q("#editor").hidden = true; q("#preview").hidden = false; q("#approve-bar").hidden = false;
    q("#confirm").checked = false; q("#approve").disabled = true;
    q("#step-label").textContent = "手順 2/2　試し描きを確かめる";
  } catch (e) { alertBar(e); }
};
q("#redo").onclick = () => showEditor();
q("#confirm").onchange = () => { q("#approve").disabled = !q("#confirm").checked; };
q("#approve").onclick = async () => {
  try {
    await api("/api/approve", body());
    q("#preview").hidden = true; q("#approve-bar").hidden = true; q("#done").hidden = false;
    q("#step-label").textContent = "完了";
  } catch (e) { alertBar(e); }
};

function showEditor() {
  q("#editor").hidden = false; q("#preview").hidden = true; q("#approve-bar").hidden = true;
  q("#step-label").textContent = "手順 1/2　合計点を書く欄を囲む";
  draw();
}

function alertBar(e) { q("#step-label").textContent = `うまくいきませんでした: ${e.message}`; }

(async () => {
  try {
    const st = await api("/api/state");
    if (st.current) { rect = st.current; q("#lower-half").checked = false; }
    else if (st.detected) { rect = st.detected; detected = true; q("#detected-note").hidden = false; }
    q("#try").disabled = !rect;
    const img = q("#page-img");
    img.onload = () => draw();
    img.src = `/img?w=1400&t=${TOKEN}`;
    showEditor();
  } catch (e) { alertBar(e); }
})();
</script>
</body>
</html>
